# https://github.com/softprops/action-gh-release
name: Build and Release

on:
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # Remplace par ta version de Python

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Create virtual environment and build
        shell: bash
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" == "Windows" ]; then
            .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pyinstaller --onefile script.py
          deactivate

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mv dist/script.exe dist/script-windows.exe

      - name: Rename binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/script dist/script-linux

      - name: Rename binary (macOS)
        if: runner.os == 'macOS'
        run: |
          mv dist/script dist/script-macos

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Upload binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/binaries-*/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
